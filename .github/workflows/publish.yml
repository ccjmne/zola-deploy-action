name: Publish Image

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push latest
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/zola-deploy-action:latest

      - name: Verify image
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/zola-deploy-action:latest
          docker image inspect ghcr.io/${{ github.repository_owner }}/zola-deploy-action:latest --format '{{.Id}}'
